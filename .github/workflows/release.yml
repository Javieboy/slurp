name: release

# Cutting a release is pushing a tag. Everything below is what used to be a
# manual build on one specific laptop, which is exactly the fragility this
# replaces: with the key in secrets, any machine can ship an update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # Fail here rather than three steps later with a confusing Gradle error.
      # Without a real key the build would silently fall back to the runner's
      # throwaway debug key, and publishing THAT is the one outcome this
      # workflow must never produce — every existing install would refuse the
      # update with a signature mismatch.
      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -z "$SIGNING_STORE_PASSWORD" ] && missing="$missing SIGNING_STORE_PASSWORD"
          [ -z "$SIGNING_KEY_ALIAS" ] && missing="$missing SIGNING_KEY_ALIAS"
          [ -z "$SIGNING_KEY_PASSWORD" ] && missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See 'Releasing' in README.md for how to create the key and set them."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$SIGNING_STORE_FILE"
          # A truncated or mis-pasted secret produces a file that is not a
          # keystore at all; find that out now, not after a 40-minute build.
          keytool -list -keystore "$SIGNING_STORE_FILE" \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null
          echo "keystore decoded and the alias opens"

      # A tag that disagrees with versionName is worse than a typo: AppUpdater
      # compares the newest tag against the *installed* versionName, so a
      # mismatch leaves every user with an update prompt that never goes away.
      - name: Tag must match versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG versionName=$NAME"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $NAME in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # The gate. AGP falls back to a debug key rather than failing, so the only
      # reliable check is to look at what actually came out of the build.
      - name: Refuse to publish a debug-signed APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in *unsigned*)
              echo "::error::$apk is unsigned"; exit 1;;
            esac
            CERT=$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | grep 'certificate DN' | head -1)
            echo "$apk -> $CERT"
            case "$CERT" in *"CN=Android Debug"*)
              echo "::error::$apk is signed with a DEBUG key. Refusing to publish."
              exit 1;;
            esac
            "$APKSIGNER" verify "$apk" || { echo "::error::$apk fails signature verification"; exit 1; }
          done
          echo "all release APKs are signed with a non-debug key and verify"

      # Names matter: AppUpdater builds the download URL from them, trying the
      # device's ABI first and falling back to universal. See AppUpdater.kt.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk

      - name: Shred the keystore
        if: always()
        run: shred -u "$SIGNING_STORE_FILE" 2>/dev/null || rm -f "$SIGNING_STORE_FILE"
