org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Note: android.bundle.enableUncompressedNativeLibs used to be set here. AGP
# removed it in 8.1 and its old behaviour is now the default, so setting it is
# a hard build failure rather than a warning. The setting that still matters
# for the bundled Python runtime is jniLibs.useLegacyPackaging in
# app/build.gradle.kts.

kotlin.code.style=official
