org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# youtubedl-android ships a Python runtime as native libs and unpacks it at
# first launch. It cannot do that from a compressed APK entry, so native libs
# must stay uncompressed and be extracted on install. Flipping either of these
# produces a build that installs fine and then fails at runtime with a
# confusing "Failed to initialize" on the very first request.
android.bundle.enableUncompressedNativeLibs=false

kotlin.code.style=official
